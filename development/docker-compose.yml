# Local Nautobot test stack for this plugin. Postgres + Redis + a Nautobot
# container running the plugin (editable). Dev-only credentials — never used in
# production.
#
#   docker compose -f development/docker-compose.yml up -d --build
#   docker compose -f development/docker-compose.yml exec nautobot nautobot-server migrate
#   docker compose -f development/docker-compose.yml exec nautobot pytest -q
#   docker compose -f development/docker-compose.yml down -v
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nautobot
      POSTGRES_PASSWORD: nautobot
      POSTGRES_DB: nautobot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nautobot -d nautobot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  nautobot:
    build:
      context: ..
      dockerfile: development/Dockerfile
      args:
        NAUTOBOT_VERSION: ${NAUTOBOT_VERSION:-3.2.2}
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NAUTOBOT_CONFIG: /source/nautobot_config.py
      DJANGO_SETTINGS_MODULE: nautobot_config
      NAUTOBOT_SECRET_KEY: forward-nautobot-container-dev-key
      NAUTOBOT_DB_ENGINE: django.db.backends.postgresql
      NAUTOBOT_DB_HOST: postgres
      NAUTOBOT_DB_PORT: "5432"
      NAUTOBOT_DB_NAME: nautobot
      NAUTOBOT_DB_USER: nautobot
      NAUTOBOT_DB_PASSWORD: nautobot
      NAUTOBOT_REDIS_HOST: redis
      NAUTOBOT_REDIS_PORT: "6379"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ..:/source
    working_dir: /source
    ports:
      - "8080:8080"
    # Idle by default so we can exec migrate / pytest / runserver into it.
    command: sleep infinity
