name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    name: Lint (ruff + pre-commit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build httpx pytest
          python -m pip install .

      - name: Run sensitive-content gate
        run: python scripts/check_sensitive_content.py --all-history

      - name: Run repo harness gate
        run: python scripts/check_harness.py

      - name: Run release-state gate
        run: python scripts/check_release_state.py

      - name: Run query contract gate
        run: python scripts/check_query_contracts.py

      - name: Run release-helper unit tests
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Generate contract diff report
        run: python scripts/generate_contract_diff_report.py --baseline-ref HEAD~1 --output dist/contract-diff-report.json

      - name: Run tests
        run: python -m pytest -q -m "not integration"

      - name: Build distribution artifacts
        run: python -m build

      - name: Verify wheel contents
        run: python scripts/check_wheel_contents.py

      - name: Upload contract diff report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: contract-diff-report
          path: dist/contract-diff-report.json

  nautobot:
    name: Nautobot ${{ matrix.nautobot-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        nautobot-version: ["3.1.8", "3.2.2"]
    env:
      COMPOSE_PROJECT_NAME: forward-nautobot-ci-${{ strategy.job-index }}
      NAUTOBOT_VERSION: ${{ matrix.nautobot-version }}
      PYTHON_VERSION: "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build and start disposable stack
        run: docker compose -f development/docker-compose.yml up -d --build

      - name: Wait for startup migrations
        run: |
          container_id="$(docker compose -f development/docker-compose.yml ps -q nautobot)"
          for attempt in {1..120}; do
            health="$(docker inspect --format '{{.State.Health.Status}}' "$container_id")"
            if [ "$health" = "healthy" ]; then
              exit 0
            fi
            if [ "$health" = "unhealthy" ]; then
              docker compose -f development/docker-compose.yml logs --tail 200 nautobot
              exit 1
            fi
            sleep 2
          done
          docker compose -f development/docker-compose.yml logs --tail 200 nautobot
          exit 1

      - name: Apply migrations
        run: >-
          docker compose -f development/docker-compose.yml exec -T nautobot
          nautobot-server migrate --noinput

      - name: Run complete non-live suite without skips
        run: >-
          docker compose -f development/docker-compose.yml exec -T
          -e FORWARD_STRICT_NO_SKIPS=1 nautobot
          python -m pytest tests/ -q -p no:django -m "not integration"

      - name: Verify contrib repeat-apply idempotence
        run: >-
          docker compose -f development/docker-compose.yml exec -T nautobot
          nautobot-server shell < scripts/check_contrib_idempotence.py

      - name: Tear down disposable stack
        if: always()
        run: docker compose -f development/docker-compose.yml down -v
