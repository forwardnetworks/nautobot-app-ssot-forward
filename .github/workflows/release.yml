name: Release

# Tag-triggered delivery pipeline. All validation is intentionally run locally
# before the tag is pushed. This workflow only builds release artifacts, creates
# the GitHub release, and publishes the distributions to PyPI via Trusted
# Publishing (OIDC) — no API token is stored anywhere.
#
# One-time setup required before the first tag will publish to PyPI:
#   1. On PyPI: project nautobot-app-ssot-forward -> Manage -> Publishing -> add a
#      GitHub Trusted Publisher: owner=forwardnetworks,
#      repo=nautobot-app-ssot-forward, workflow=release.yml, environment=pypi.
#   2. In this repo: Settings -> Environments -> create an environment named
#      "pypi".

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # allow a manual re-publish from the Actions tab

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build + GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub release + upload assets
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build distribution artifacts
        run: python -m build

      - name: Generate CycloneDX SBOM
        # Software Bill of Materials over the declared runtime deps, kept OUT of
        # dist/ (which is uploaded to PyPI) and published as its own artifact for
        # supply-chain review. Non-blocking: the SBOM is supplementary and must
        # never fail the release.
        continue-on-error: true
        run: |
          python -m pip install cyclonedx-bom
          mkdir -p sbom
          printf '%s\n' httpx diffsync cryptography nautobot nautobot-ssot > sbom-reqs.txt
          cyclonedx-py requirements sbom-reqs.txt \
            --output-format JSON --output-file sbom/nautobot-app-ssot-forward-sbom.json

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom/

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz

  publish-pypi:
    name: Publish to PyPI (Trusted Publishing)
    needs: build
    runs-on: ubuntu-latest
    # Only publish on real release tags, never on a manual workflow_dispatch
    # against a branch (which has no version tag to release).
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/nautobot-app-ssot-forward/
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
