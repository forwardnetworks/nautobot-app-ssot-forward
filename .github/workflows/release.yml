name: Release

# Tag-triggered release pipeline. The `build` job runs the release gates + tests,
# builds the sdist + wheel, generates a CycloneDX SBOM, and creates the GitHub
# release with assets. The `publish-pypi` job then uploads the distributions to
# PyPI via Trusted Publishing (OIDC) — no API token is stored anywhere.
#
# One-time setup required before the first tag will publish to PyPI:
#   1. On PyPI: project nautobot-app-ssot-forward -> Manage -> Publishing -> add a
#      GitHub Trusted Publisher: owner=forwardnetworks,
#      repo=nautobot-app-ssot-forward, workflow=release.yml, environment=pypi.
#   2. In this repo: Settings -> Environments -> create an environment named
#      "pypi" (optionally add required reviewers to gate publishes).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # allow a manual re-publish from the Actions tab

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build + GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub release + upload assets
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build httpx pytest
          python -m pip install .

      - name: Run sensitive-content gate
        run: python scripts/check_sensitive_content.py --all-history

      - name: Run repo harness gate
        run: python scripts/check_harness.py

      - name: Run release-state gate
        run: python scripts/check_release_state.py

      - name: Run query contract gate
        run: python scripts/check_query_contracts.py

      - name: Generate contract diff report
        run: python scripts/generate_contract_diff_report.py --baseline-ref HEAD~1 --output dist/contract-diff-report.json

      - name: Run tests
        run: python -m pytest -q -m "not integration"

      - name: Build distribution artifacts
        run: python -m build

      - name: Verify wheel contents
        run: python scripts/check_wheel_contents.py

      - name: Generate CycloneDX SBOM
        # Software Bill of Materials over the declared runtime deps, kept OUT of
        # dist/ (which is uploaded to PyPI) and published as its own artifact for
        # supply-chain review. Non-blocking: the SBOM is supplementary and must
        # never fail the release.
        continue-on-error: true
        run: |
          python -m pip install cyclonedx-bom
          mkdir -p sbom
          printf '%s\n' httpx diffsync cryptography nautobot nautobot-ssot > sbom-reqs.txt
          cyclonedx-py requirements sbom-reqs.txt \
            --output-format JSON --output-file sbom/nautobot-app-ssot-forward-sbom.json

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom/

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/contract-diff-report.json

  publish-pypi:
    name: Publish to PyPI (Trusted Publishing)
    needs: build
    runs-on: ubuntu-latest
    # Only publish on real release tags, never on a manual workflow_dispatch
    # against a branch (which has no version tag to release).
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/nautobot-app-ssot-forward/
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Remove non-distribution assets
        # The GitHub-release step bundled a contract-diff report into dist/; PyPI
        # must receive only the sdist + wheel.
        run: find dist -type f ! -name '*.whl' ! -name '*.tar.gz' -delete

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
